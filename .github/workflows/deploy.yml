name: Deploy homepage to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual runs from the Actions tab

# Permissions needed to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Single source of truth for the Typst version is .typst-version.
      # Refresh it locally with `./build.sh sync-version`, then commit.
      - name: Read pinned Typst version
        id: typst
        run: echo "version=$(cat .typst-version)" >> "$GITHUB_OUTPUT"

      - name: Install Typst ${{ steps.typst.outputs.version }}
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${{ steps.typst.outputs.version }}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          echo "${PWD}/typst-x86_64-unknown-linux-musl" >> "${GITHUB_PATH}"

      - name: Build site
        run: |
          mkdir -p _site
          cp -r assets _site/
          typst compile --features html index.typ _site/index.html
          # Inject the favicon into <head> (Typst's HTML export cannot place <link> there).
          perl -pi -e 's{<head>}{<head><link rel="icon" type="image/png" href="assets/favicon.png">}' _site/index.html
          touch _site/.nojekyll   # tell Pages not to run Jekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
