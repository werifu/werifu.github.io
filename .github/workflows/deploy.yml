name: Deploy homepage to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual runs from the Actions tab

# Permissions needed to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TYPST_VERSION: "0.15.0"   # keep in sync with your local Typst version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Typst ${{ env.TYPST_VERSION }}
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          echo "${PWD}/typst-x86_64-unknown-linux-musl" >> "${GITHUB_PATH}"

      - name: Build site
        run: |
          mkdir -p _site
          cp -r assets _site/
          typst compile --features html index.typ _site/index.html
          touch _site/.nojekyll   # tell Pages not to run Jekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
